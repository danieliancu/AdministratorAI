[project]
name = "administrator-ai"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S608"]
"**/migrations/*.py" = ["E501", "S608"]
"apps/core/db/operations.py" = ["E501", "S608"]
"config/settings/*.py" = ["F405"]
