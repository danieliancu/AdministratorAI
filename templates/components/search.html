<form method="get" class="toolbar" role="search">
  <div class="field">
    <label for="q">{{ label }}</label>
    <input id="q" type="search" name="q" value="{{ search }}"
           hx-get="{{ url }}" hx-trigger="input changed delay:300ms, search"
           hx-target="#results" hx-include="closest form" hx-push-url="true">
  </div>
  {{ extra }}
</form>
