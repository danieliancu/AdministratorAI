{% extends "base_platform.html" %}
{% block title %}Firme{% endblock %}
{% block content %}
<div class="topbar" style="margin-bottom:1rem">
  <h1 style="margin:0">Firme</h1>
  {% if can_manage %}<a class="btn btn-primary" href="{% url 'platform:tenant-new' %}">Firmă nouă</a>{% endif %}
</div>
<form method="get" class="field" role="search" style="max-width:24rem">
  <label for="q">Caută după nume</label>
  <input id="q" type="search" name="q" value="{{ search }}"
         hx-get="{% url 'platform:tenants' %}"
         hx-trigger="input changed delay:300ms, search"
         hx-target="#tenants-table"
         hx-push-url="true">
</form>
<section class="card" id="tenants-table" aria-live="polite">
  {% include "platform/_tenants_table.html" %}
</section>
{% endblock %}
